name: Atualizar classificacoes e jogos

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Atualizar todas as competicoes cadastradas
        run: |
          curl --fail --show-error --silent --max-time 900 \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/admin/sync"
