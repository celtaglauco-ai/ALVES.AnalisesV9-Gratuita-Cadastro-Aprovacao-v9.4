services:
  - type: web
    name: alves-analises-v11
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: FOOTBALL_DATA_TOKEN
        sync: false
      - key: CRON_SECRET
        generateValue: true
